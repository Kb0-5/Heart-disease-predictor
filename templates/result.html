<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; text-align: center; padding: 20px; }
        .card { border: 2px solid #ddd; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .result { font-size: 24px; font-weight: bold; margin: 20px 0; color: #d9534f; }
        .safe { color: #5cb85c; }
        .back-btn { background: none; border: none; color: #007bff; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .back-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Assessment Result</h2>
        <div class="result {% if 'No' in prediction %}safe{% endif %}">
            {{ prediction }}
        </div>
        
        <!-- Form passing input values back to the main route -->
        <form action="/" method="POST">
            {% for key, val in inputs.items() %}
                <input type="hidden" name="{{ key }}" value="{{ val }}">
            {% endfor %}
            <button type="submit" class="back-btn">← Go Back to Form</button>
        </form>
    </div>
</body>
</html>
